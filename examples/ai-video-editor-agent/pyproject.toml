[project]
name = "ai-video-editor-agent"
version = "1.0.0"
description = "Vision-powered autonomous AI video editing agent with evidence-based editorial decisions, self-auditing visual QA, and NLE export bridges."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AV Editor Agent Team" }]
keywords = ["video-editing", "computer-vision", "vlm", "langgraph", "nle", "davinci-resolve", "fcpxml", "otio"]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "structlog>=24.1",
    "numpy>=1.26",
    "scipy>=1.12",
    "opencv-python-headless>=4.9",
    "imagehash>=4.3",
    "Pillow>=10.2",
    "PyYAML>=6.0",
    "orjson>=3.9",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
full = [
    "scenedetect[opencv]>=0.6.4",
    "librosa>=0.10",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "mediapipe>=0.10",
    "opentimelineio>=0.17",
    "whisperx>=3.1",
    "langgraph>=0.0.30",
    "duckdb>=0.10",
    "pandas>=2.2",
    "torch>=2.2",
    "torchaudio>=2.2",
    "open_clip_torch>=2.24",
    "scikit-image>=0.22",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
av-editor = "av_editor.cli:app_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/av_editor"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "scenedetect.*|librosa.*|soundfile.*|pyloudnorm.*|mediapipe.*|opentimelineio.*|otio.*|whisperx.*|imagehash.*|cv2.*|scipy.*|skimage.*|langgraph.*|duckdb.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: tests requiring external network access (disabled by default)",
    "gpu: tests requiring GPU hardware",
    "resolve: tests requiring a DaVinci Resolve installation",
]
